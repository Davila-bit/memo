<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F1E9">
<title>Memo kitchen screen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F6F1E9; --surface: #FFFDF8; --ink: #1F2A2E; --muted: #5B6670;
    --sage: #5E8C7B; --amber: #B9771F; --coral: #C8483B; --sky: #3B7EA1;
    --serif: "Fraunces", Georgia, "Times New Roman", serif;
    --sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); font-family: var(--sans); }
  body { overflow: hidden; -webkit-user-select: none; user-select: none; }
  .screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
            justify-content: center; gap: 4vmin; padding: max(6vmin, env(safe-area-inset-top)) 6vmin; text-align: center; }
  [hidden] { display: none !important; }
  h1, .clock, .big { font-family: var(--serif); font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  .clock { font-size: clamp(5rem, 24vmin, 18rem); line-height: 1; font-variant-numeric: lining-nums; }
  .day { font-family: var(--serif); font-weight: 500; font-size: clamp(2rem, 7vmin, 4.5rem); color: var(--ink); margin: 0; }
  .note { font-size: clamp(1.6rem, 4.6vmin, 3rem); color: var(--muted); margin: 0; max-width: 22ch; line-height: 1.3; }
  .big { font-size: clamp(2.6rem, 9vmin, 6.5rem); line-height: 1.12; max-width: 16ch; }
  button.primary { font: 600 clamp(1.8rem, 6vmin, 3.4rem)/1.2 var(--sans); color: var(--surface); background: var(--sage);
                   border: 0; border-radius: 2.4rem; padding: 0.9em 1.4em; min-width: min(80vw, 18em); min-height: 96px;
                   box-shadow: 0 6px 24px rgba(31,42,46,.18); cursor: pointer; }
  button.primary:focus-visible { outline: 6px solid var(--sky); outline-offset: 6px; }
  .bell { width: clamp(6rem, 22vmin, 14rem); height: auto; color: var(--sage); }
  .ringing .bell { animation: ring 1.4s ease-in-out infinite; transform-origin: 50% 10%; }
  @keyframes ring { 0%,100% { transform: rotate(0); } 10% { transform: rotate(14deg); } 20% { transform: rotate(-12deg); }
                    30% { transform: rotate(8deg); } 40% { transform: rotate(-4deg); } 50% { transform: rotate(0); } }
  @media (prefers-reduced-motion: reduce) { .ringing .bell { animation: none; } }
  #call { padding: 0; background: var(--paper); }
  #remote { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: var(--paper); }
  #self { position: absolute; right: 3vmin; bottom: calc(3vmin + env(safe-area-inset-bottom)); width: clamp(120px, 22vmin, 260px);
          aspect-ratio: 3 / 4; object-fit: cover; border-radius: 18px; border: 4px solid var(--surface);
          box-shadow: 0 6px 24px rgba(31,42,46,.25); transform: scaleX(-1); background: var(--ink); }
  .chip { position: fixed; left: 3vmin; top: calc(3vmin + env(safe-area-inset-top)); display: inline-flex; align-items: center; gap: .5em;
          font: 700 clamp(1.2rem, 2.6vmin, 1.6rem)/1 var(--sans); /* >= 18.66px bold: AA large text for amber */ padding: .55em .9em; border-radius: 999px;
          background: var(--surface); box-shadow: 0 2px 10px rgba(31,42,46,.12); z-index: 5; }
  .chip svg { width: 1.2em; height: 1.2em; }
  .chip.ok { color: var(--sage); } .chip.wait { color: var(--amber); } .chip.bad { color: var(--coral); }
  #watchDisclosure { position: fixed; bottom: 3vmin; left: 4vmin; right: 4vmin; z-index: 5;
    font-size: clamp(1.6rem, 4vmin, 3rem); background: var(--surface); padding: .7em; border-radius: 1rem; }
  #tapAudio { position: fixed; inset: auto 0 0 0; z-index: 6; }
  #tapAudio button { width: 100%; border-radius: 0; min-height: 120px; background: var(--sky); }
</style>
</head>
<body>
<!-- Status: always icon + word + colour -->
<div id="chip" class="chip wait" role="status" aria-live="polite">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
  <span id="chipText">Starting</span>
</div>

<section id="setup" class="screen" aria-labelledby="setupTitle">
  <h1 id="setupTitle" class="big">Kitchen screen</h1>
  <p class="note">This screen lets her helper call. Tap once to turn on sound and the camera.</p>
  <button id="ready" class="primary" type="button">Tap once to get ready</button>
</section>

<section id="idle" class="screen" hidden aria-labelledby="clock">
  <p id="clock" class="clock">--:--</p>
  <p id="day" class="day"></p>
  <p class="note"><span class="who">Sarah</span>'s helper will call here.</p>
</section>

<section id="ringing" class="screen ringing" hidden aria-live="assertive">
  <svg class="bell" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M32 6c-10 0-17 8-17 18v10l-5 9h44l-5-9V24c0-10-7-18-17-18z"/><path d="M26 49a6 6 0 0 0 12 0"/>
  </svg>
  <h1 class="big"><span class="who">Sarah</span>'s helper is calling…</h1>
  <p class="note">It will start by itself.</p>
</section>

<section id="call" class="screen" hidden aria-label="Call with the helper">
  <video id="remote" autoplay playsinline></video>
  <video id="self" autoplay playsinline muted aria-label="You"></video>
  <audio id="remoteAudio" autoplay></audio>
</section>

<p id="watchDisclosure" hidden role="status"></p>
<video id="watchVideo" autoplay playsinline muted hidden></video>

<div id="tapAudio" hidden><button class="primary" type="button">Tap to hear the helper</button></div>

<script src="https://cdn.jsdelivr.net/npm/livekit-client@2.23.0/dist/livekit-client.umd.js"></script>
<script>
(() => {
  "use strict";
  const LK = window.LivekitClient;
  const WATCH_ENABLED = /* HEARTH_WATCH */ false;
  const q = new URLSearchParams(location.search);
  const KEY = q.get("key") || "";
  const DEVICE = (q.get("device") || "kitchen").toLowerCase();
  const WHO = q.get("daughter") || "Sarah";
  const ANSWER_MS = 3000;
  const READY_FLAG = "hearth-kiosk-ready:" + DEVICE;
  const $ = (id) => document.getElementById(id);
  document.querySelectorAll(".who").forEach((el) => (el.textContent = WHO));

  let room = null, mic = null, cam = null, audioCtx = null, chimeTimer = null, answerTimer = null;
  let state = "setup", backoff = 1000, wakeLock = null, connecting = false;

  // ---------------------------------------------------------------- view
  const ICONS = {
    ok: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
    wait: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    bad: '<path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17.5v.5"/>',
  };
  function chip(kind, text) {
    const c = $("chip");
    c.className = "chip " + kind;
    c.querySelector("svg").innerHTML = ICONS[kind];
    $("chipText").textContent = text;
  }
  function show(next) {
    state = next;
    for (const id of ["setup", "idle", "ringing", "call"]) $(id).hidden = id !== next;
    $("chip").hidden = next === "call";
  }
  function tick() {
    const d = new Date();
    $("clock").textContent = d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    const h = d.getHours();
    const part = h < 12 ? "morning" : h < 17 ? "afternoon" : h < 21 ? "evening" : "night";
    $("day").textContent = d.toLocaleDateString([], { weekday: "long" }) + " " + part;
  }
  setInterval(tick, 5000); tick();

  // ---------------------------------------------------------------- sound
  function unlockAudio() {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
    } catch (e) { /* no WebAudio: no chime */ }
  }
  function tone(freq, at, len) {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = "sine"; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(0.25, at + 0.04);
    g.gain.exponentialRampToValueAtTime(0.0001, at + len);
    o.connect(g).connect(audioCtx.destination); o.start(at); o.stop(at + len + 0.05);
  }
  function chime() {
    if (!audioCtx) return;
    const t = audioCtx.currentTime + 0.02;
    tone(659.25, t, 0.6); tone(523.25, t + 0.45, 0.9);
  }
  function startChime() { stopChime(); chime(); chimeTimer = setInterval(chime, 1600); }
  function stopChime() { if (chimeTimer) clearInterval(chimeTimer); chimeTimer = null; }

  // ---------------------------------------------------------------- media
  async function setPrivate(on) {
    // on = muted: until "answered" the helper sees and hears nothing
    for (const t of [mic, cam]) {
      if (!t) continue;
      try { on ? await t.mute() : await t.unmute(); } catch (e) { console.warn("mute", e); }
    }
  }
  async function makeTracks() {
    if (mic && cam) return;
    const tracks = await LK.createLocalTracks({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
      video: { facingMode: "user", resolution: { width: 1280, height: 720, frameRate: 15 } },
    });
    for (const t of tracks) { if (t.kind === "audio") mic = t; else cam = t; }
  }
  async function keepAwake() {
    try {
      if ("wakeLock" in navigator && document.visibilityState === "visible" && !wakeLock) {
        wakeLock = await navigator.wakeLock.request("screen");
        wakeLock.addEventListener("release", () => { wakeLock = null; });
      }
    } catch (e) { /* not allowed here; Fully Kiosk keeps the screen on */ }
  }
  document.addEventListener("visibilitychange", keepAwake);

  // ---------------------------------------------------------------- opt-in watch (separate from call media)
  let watchStream = null, watchOpening = null, watchTimer = null, watchEpoch = 0;
  let watchPosting = false, watchPolling = false;
  const watchVideo = $("watchVideo");
  $("watchDisclosure").textContent = WHO + "'s helper is keeping an eye on you. " + WHO + " can see a picture.";

  async function stopWatch() {
    ++watchEpoch;
    clearInterval(watchTimer); watchTimer = null;
    $("watchDisclosure").hidden = true;
    if (watchStream) watchStream.getTracks().forEach((track) => track.stop());
    watchStream = null;
    watchVideo.srcObject = null;
    // A permission request may still be resolving: release its tracks before the call continues.
    if (watchOpening) await watchOpening;
  }
  async function sendWatchFrame() {
    if (watchPosting || !watchStream || state !== "idle" || helpers().length) return;
    const epoch = watchEpoch;
    if (!watchVideo.videoWidth) return;
    watchPosting = true;
    const canvas = document.createElement("canvas");
    try {
      const scale = 512 / Math.max(watchVideo.videoWidth, watchVideo.videoHeight);
      canvas.width = Math.round(watchVideo.videoWidth * scale);
      canvas.height = Math.round(watchVideo.videoHeight * scale);
      canvas.getContext("2d").drawImage(watchVideo, 0, 0, canvas.width, canvas.height);
      const blob = await new Promise((resolve) => canvas.toBlob(resolve, "image/jpeg", 0.7));
      if (!blob || blob.size > 300 * 1024 || epoch !== watchEpoch || state !== "idle") return;
      const r = await fetch(`/internal/watch/frame?key=${encodeURIComponent(KEY)}`, {
        method: "POST", headers: { "Content-Type": "image/jpeg" }, body: blob, cache: "no-store",
      });
      if (r.status === 409 || r.status === 404) await stopWatch();
    } catch (e) { /* retry on the next interval; never log an image */ }
    finally { canvas.width = 0; canvas.height = 0; watchPosting = false; }
  }
  async function pollWatch() {
    if (watchPolling) return;
    watchPolling = true;
    try {
      const r = await fetch(`/internal/watch/state?key=${encodeURIComponent(KEY)}`, { cache: "no-store" });
      if (!r.ok) { await stopWatch(); return; }
      const result = await r.json();
      if (!result.active || state !== "idle" || helpers().length) { await stopWatch(); return; }
      if (watchStream || watchOpening) return;
      const epoch = ++watchEpoch;
      $("watchDisclosure").hidden = false;
      watchOpening = navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false })
        .then(async (stream) => {
          if (epoch !== watchEpoch || state !== "idle" || helpers().length) {
            stream.getTracks().forEach((track) => track.stop()); return;
          }
          watchStream = stream;
          watchVideo.srcObject = stream;
          await watchVideo.play();
          if (epoch !== watchEpoch || !watchStream) return;
          watchTimer = setInterval(sendWatchFrame, 10000);
          void sendWatchFrame();
        }).catch(() => {
          if (watchStream) watchStream.getTracks().forEach((track) => track.stop());
          watchStream = null; watchVideo.srcObject = null; $("watchDisclosure").hidden = true;
        }).finally(() => { watchOpening = null; });
    } catch (e) { await stopWatch(); }
    finally { watchPolling = false; }
  }
  if (WATCH_ENABLED) { setInterval(pollWatch, 10000); void pollWatch(); }
  window.addEventListener("pagehide", () => { void stopWatch(); });

  // ---------------------------------------------------------------- call states
  function helpers() {
    return room ? Array.from(room.remoteParticipants.values()) : [];
  }
  function onHelperJoined() {
    if (WATCH_ENABLED) {
      if (watchStream || watchOpening) { stopWatch().then(onHelperJoined); return; }
      void stopWatch();
    }
    if (state === "ringing" || state === "call") return;
    show("ringing"); startChime();
    clearTimeout(answerTimer);
    answerTimer = setTimeout(answer, ANSWER_MS);
  }
  async function answer() {
    if (!helpers().length) return toIdle();
    stopChime();
    show("call");
    if (cam) cam.attach($("self"));
    attachRemote();
    await setPrivate(false);
    if (room && !room.canPlaybackAudio) $("tapAudio").hidden = false;
  }
  function attachRemote() {
    for (const p of helpers()) {
      for (const pub of p.trackPublications.values()) {
        if (!pub.track) continue;
        if (pub.kind === "video") pub.track.attach($("remote"));
        if (pub.kind === "audio") pub.track.attach($("remoteAudio"));
      }
    }
  }
  async function toIdle() {
    clearTimeout(answerTimer); stopChime();
    await setPrivate(true);
    $("remote").srcObject = null; $("tapAudio").hidden = true;
    if (cam) cam.detach($("self"));
    show("idle");
  }

  // ---------------------------------------------------------------- connection (reconnects forever)
  async function connect() {
    if (connecting) return;
    connecting = true;
    chip("wait", "Connecting");
    try {
      const r = await fetch(`/api/kiosk/token?device=${encodeURIComponent(DEVICE)}&key=${encodeURIComponent(KEY)}`,
                            { cache: "no-store" });
      if (!r.ok) throw new Error("token " + r.status);
      const tok = await r.json();
      await makeTracks();
      const rm = new LK.Room({ adaptiveStream: true, dynacast: true });
      rm.on(LK.RoomEvent.ParticipantConnected, () => onHelperJoined())
        .on(LK.RoomEvent.ParticipantDisconnected, () => { if (!helpers().length) toIdle(); })
        .on(LK.RoomEvent.TrackSubscribed, () => { if (state === "call") attachRemote(); })
        .on(LK.RoomEvent.Reconnecting, () => chip("wait", "Reconnecting"))
        .on(LK.RoomEvent.Reconnected, () => chip("ok", "Ready for calls"))
        .on(LK.RoomEvent.AudioPlaybackStatusChanged, () => {
          $("tapAudio").hidden = rm.canPlaybackAudio || state !== "call";
        })
        .on(LK.RoomEvent.Disconnected, () => {
          if (room !== rm) return;
          room = null; toIdle(); chip("bad", "Not connected"); retry();
        });
      await rm.connect(tok.url, tok.token, { autoSubscribe: true });
      room = rm;
      // publish muted: nobody sees or hears the kitchen until a call is answered
      await rm.localParticipant.publishTrack(mic, { source: LK.Track.Source.Microphone });
      await rm.localParticipant.publishTrack(cam, { source: LK.Track.Source.Camera, simulcast: false });
      await setPrivate(true);
      backoff = 1000;
      chip("ok", "Ready for calls");
      if (state === "setup") show("idle");
      if (helpers().length) onHelperJoined();
    } catch (e) {
      console.warn("kiosk connect failed", e);
      chip("bad", "Not connected");
      retry();
    } finally {
      connecting = false;
    }
  }
  function retry() {
    const wait = backoff;
    backoff = Math.min(backoff * 2, 30000);
    setTimeout(connect, wait);
  }

  // ---------------------------------------------------------------- start
  async function getReady() {
    unlockAudio();
    keepAwake();
    try { localStorage.setItem(READY_FLAG, "1"); } catch (e) { /* storage blocked */ }
    if (room) room.startAudio().catch(() => {});
    if (state === "setup") show("idle");
    connect();
  }
  $("ready").addEventListener("click", getReady);
  $("tapAudio").addEventListener("click", () => {
    unlockAudio();
    if (room) room.startAudio().then(() => { $("tapAudio").hidden = true; }).catch(() => {});
  });
  // any tap re-unlocks sound (Android Chrome forgets after a reload)
  document.addEventListener("pointerdown", () => { unlockAudio(); if (room) room.startAudio().catch(() => {}); });

  let remembered = false;
  try { remembered = localStorage.getItem(READY_FLAG) === "1"; } catch (e) { /* storage blocked */ }
  if (!LK) { chip("bad", "Can't load. Check the internet"); setTimeout(() => location.reload(), 15000); }
  else if (remembered) { show("idle"); keepAwake(); connect(); }
  else { show("setup"); chip("wait", "Waiting for a tap"); }
})();
</script>
</body>
</html>
