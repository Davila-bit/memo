[project]
name = "hearth-backend"
version = "0.1.0"
description = "Hearth Home API: check-ins, events, schedule, calls, notifications"
requires-python = ">=3.12,<3.13"
dependencies = [
    "hearth-contracts",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "httpx>=0.27",
    # core (store, auth)
    # calls (LiveKit, Chert)
    # integrations (push, search, digest, redaction)
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.uv.sources]
hearth-contracts = { path = "../contracts", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hearth"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
