[project]
name = "hearth-contracts"
version = "0.1.0"
description = "Shared data contracts for Memo (API, web, agent)"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hearth_contracts"]
