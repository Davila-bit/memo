[project]
name = "hearth-agent"
version = "0.1.0"
description = "Hearth Home check-in agent: livekit-agents worker with Gemini Live (hears, sees, speaks)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "hearth-contracts",
    "livekit-agents>=1.8,<1.9",
    "livekit-plugins-google>=1.8,<1.9",
    "livekit-api>=1.0",
    "pillow>=11",
    "httpx>=0.27",
    "pydantic>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "numpy>=2.5.4",
]

[tool.uv.sources]
hearth-contracts = { path = "../contracts", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hearth_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
