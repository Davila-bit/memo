# Every push to main and every pull request runs all three test suites.
# No secrets: every integration has a no-key mode, and the web e2e runs against mock mode.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend (ruff + pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check hearth tests
      - run: uv run pytest -q tests

  agent:
    name: agent (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: agent/uv.lock
      - run: uv sync --locked
      - run: uv run pytest -q

  web:
    name: web (lint, tsc, e2e + axe)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec playwright install --with-deps chromium
      # Same as `pnpm e2e`, plus an HTML report for the artifact.
      - run: pnpm exec playwright test -c e2e/playwright.config.ts --reporter=list,html
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report
          PLAYWRIGHT_HTML_OPEN: never
      - name: Accessibility report (from this run's axe scans)
        if: always()
        run: pnpm a11y:report --out ../.ci-a11y/ACCESSIBILITY.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/e2e/.results/
            web/e2e/screenshots/
            .ci-a11y/
          if-no-files-found: warn
          retention-days: 14
