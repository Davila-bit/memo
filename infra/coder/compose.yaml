# Coder server for Memo. Start: docker compose -f infra/coder/compose.yaml up -d
# CODER_ACCESS_URL is deliberately unset: Coder then opens its built-in dev tunnel and
# serves a public https://<id>.<region>.try.coder.app URL (and sets the wildcard app URL
# to *--<id>.<region>.try.coder.app). The tunnel key lives in the hearth-coder-home volume,
# so the URL stays the same across restarts.
name: hearth-coder

services:
  coder:
    image: ghcr.io/coder/coder:v2.38.7
    container_name: hearth-coder
    restart: unless-stopped
    ports:
      - "127.0.0.1:7080:7080"
    environment:
      CODER_HTTP_ADDRESS: "0.0.0.0:7080"
      # Built-in PostgreSQL (no CODER_PG_CONNECTION_URL): data under /home/coder/.config/coderv2
      CODER_TELEMETRY_ENABLE: "false"
    group_add:
      - "949" # host `docker` group gid (getent group docker)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - hearth-coder-home:/home/coder

volumes:
  hearth-coder-home:
    name: hearth-coder-home
